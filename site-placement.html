<script>
const SETBACK = 20, GAP = 15, APRON = 115, RIG = 45;   /* 45 ft containers on a chassis unless a dock says less (rig); apron 115 ft for a 45, shorter with the rig */
const rigOf = o => o.rig || RIG, apronOf = o => APRON - (RIG - rigOf(o));
const PROP = PH_PROP;   /* packhouse-layouts.js?v=0d4d825 */
const BLDG = [
  {name:"Existing Facility",x:112.1,y:148.6,w:373.5,h:312.4},
  {name:"Headhouse",x:321.6,y:85.3,w:165.7,h:53.6},
  {name:"Lettuce Grow",x:112.1,y:461.0,w:348,h:168},   /* 4 bays of 42 ft × 29 sections of 12 ft (58,464 ft²), its west edge in line with the Existing Facility's */
  {name:"North shed",x:531.9,y:151.3,w:49.5,h:47.0},
  {name:"Middle shed",x:544.8,y:221.0,w:38.3,h:45.3},
  {name:"South shed",x:541.7,y:309.2,w:30.9,h:60.9},
  {name:"Grow 1–3",x:109.6,y:724.4,w:542.2,h:362.8},
  {name:"Grow 4",x:115.0,y:1108.7,w:336.3,h:183.2},
];
const VIEWS = {pad:[380,38,440,752], site:[0,0,1096.5,1644.7]};   /* pad: property north edge down to the top of Grow 1–3 */
const TONE = {"--flow-box":"#43647F","--flow-crop":"#3B7645","--flow-dry":"#A9702B","--ink-3":"#848C92","--survey":"#B23A2B"};
const FACES = ["N","E","S","W"];
/* the set position of each building; the arrow keys bump it from here */
const HOME = ["ph", "fert"].map(id => ({id, ...PH_SITE[id + "80"]}));   /* packhouse-layouts.js?v=0d4d825; the apron clears the property line with about 2.5 ft to spare */
let phs = HOME.map(h => ({...h})), sel = "ph";
/* Things that are not buildings, dragged freely: parking blocks and the septic. Each is a rectangle around its
   centre (x, y), turned ang degrees clockwise from running along x. A parking block is rows of 9 × 18 ft stalls, two
   rows on a 24 ft aisle or one row backing onto a road or wall. */
const STALL = 9, STALL_D = 18, AISLE = 24, SEPTIC_GAP = 5;   /* septic to any building: a placeholder, confirm with the designer */
/* the east property line runs from (609.2, 400.6) to (1025.3, 1104.3), 59.4° clockwise from x; there the block is
   one row of 20 backed 1 ft inside the line, its aisle on the Grow 3 side. The north end of the property is out: a big
   transformer stands there. */
const PARK_SPOTS = [
  {k:"East property line", x:872.3, y:888.7, ang:59.4, rows:1},
  {k:"East of Grow 3", x:680, y:850, ang:90, rows:1},          /* one row running north–south along Grow 1–3's east side */
  {k:"South of Lettuce Grow", x:300, y:680, ang:0, rows:1},    /* one row in the 88 ft gap between the Lettuce Grow and Grow 1–3 */
];
const ITEM_HOME = [
  {id:"park", kind:"park", name:"Staff parking", stalls:20, aisle:true, ...PARK_SPOTS[0]},
  {id:"parkN", kind:"park", name:"Parking, packhouse north wall", stalls:5, rows:1, x:513.6, y:479, ang:0},   /* flush on the north wall, P4 at its west end, R1's truck apron at its east */
  {id:"septic", kind:"septic", name:"Septic", len:100, wid:15, x:472.9, y:528, ang:90},   /* centred east-west in the 25.6 ft gap between the Lettuce Grow (east edge 460.1) and the packhouse (485.7) */
];
ITEM_HOME.forEach(i => delete i.k);
let items = ITEM_HOME.map(i => ({...i})), viewK = "pad";
const $ = s => document.querySelector(s), NS = "http://www.w3.org/2000/svg";
const el = (t,a={}) => { const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; };
const lay = p => PH_LAYOUTS[p.id + "80"];

/* local (x across 80, z down 100) to site, rotated clockwise in 90° steps */
function toSite(p, x, z){
  const {W, D} = lay(p);
  const q = [[x, z], [D - z, x], [W - x, D - z], [z, W - x]][p.rot];
  return [p.x + q[0], p.y + q[1]];
}
function rectLocal(p, x0, z0, x1, z1){
  const a = toSite(p, x0, z0), b = toSite(p, x1, z1);
  return {x:Math.min(a[0],b[0]), y:Math.min(a[1],b[1]), w:+Math.abs(a[0]-b[0]).toFixed(2), h:+Math.abs(a[1]-b[1]).toFixed(2)};
}
const rectOf = p => rectLocal(p, 0, 0, lay(p).W, lay(p).D);
const corners = r => [[r.x,r.y],[r.x+r.w,r.y],[r.x+r.w,r.y+r.h],[r.x,r.y+r.h]];
const faceName = (p, f) => ({N:"north",E:"east",S:"south",W:"west"})[FACES[(FACES.indexOf(f) + p.rot) % 4]];

/* the apron runs APRON ft out from the dock face, 6 ft past the outermost dock or roll-up on that face */
/* Truck geometry off the dock face (local N face). Square docks and roll-ups share one straight apron as before;
   a dock with an angle gets a dock house bolted to the wall and its own apron strip along the angled truck path.
   Angle is measured from straight out, turning toward local +x (south on the site map). Returns site polygons. */
const BOX_APRON = 50, BOX_DOCK = 75;   /* box trucks at a roll-up: truck plus room to pull in; at a 4 ft-deep dock, room to ramp back up */
const LANE = 6, SEAL = 1.5;   /* half-width of a 12 ft dock bay; seal face past each side of the door */
function dockGeom(p){
  const L = lay(p), out = {aprons:[], houses:[], trucks:[]};
  const S = pts => pts.map(q => toSite(p, q[0], q[1]));
  const box4 = (x0, z0, x1, z1) => S([[x0,z0],[x1,z0],[x1,z1],[x0,z1]]);
  const ops = L.openings.filter(o => o.face === "N" && (o.type === "dock" || o.type === "rollup"));
  const square = ops.filter(o => !o.angle);
  const sqDocks = square.filter(o => o.type === "dock" && o.truck !== "box"), rolls = square.filter(o => o.type === "rollup");
  for (const o of square.filter(o => o.truck === "box")) out.aprons.push(box4(o.a - 6, -BOX_DOCK, o.b + 6, 0));   /* box-truck dock: 4 ft down, ~75 ft to ramp back up */
  if (sqDocks.length){
    const a = Math.max(-12, Math.min(...sqDocks.map(o => o.a)) - 6), b = Math.min(L.W + 12, Math.max(...sqDocks.map(o => o.b)) + 6);
    out.aprons.push(box4(a, -APRON, b, 0));
  }
  for (const o of rolls) out.aprons.push(box4(o.a - 6, -BOX_APRON, o.b + 6, 0));
  for (const o of square){
    const cx = (o.a + o.b) / 2, len = o.type === "dock" && o.truck !== "box" ? rigOf(o) : 24;
    out.trucks.push({ body: box4(cx - 4.1, -1 - len, cx + 4.1, -1), cab: box4(cx - 4, -len - 12, cx + 4, -len - 2) });
  }
  for (const o of ops.filter(o => o.angle)){
    const th = o.angle * Math.PI / 180, cx = (o.a + o.b) / 2;
    const d = [Math.sin(th), -Math.cos(th)], n = [Math.cos(th), Math.sin(th)];
    const at = (s, t) => [cx + d[0] * s + n[0] * t, d[1] * s + n[1] * t];
    /* The seal face spans the door plus SEAL either side, and is pushed in until its far end
       meets the wall. What is left is a triangle, not a room: the shallow side is zero and the
       deep side is only what the angle costs, so the truck sits as close to the door as it can. */
    const seal = o.seal || SEAL, face = (o.b - o.a) * Math.cos(th) + 2 * seal;
    const tip = face * Math.cos(th), depth = face * Math.sin(th);
    const h = Math.sin(th) * (tip - (cx - o.a));            /* face distance along the truck axis */
    out.houses.push(S([[o.a, 0], [o.a + tip, 0], [o.a, -depth]]));
    const R = rigOf(o), AP = apronOf(o);
    out.aprons.push(S([at(h, LANE), at(h + AP, LANE), at(h + AP, -LANE), at(h, -LANE)]));
    out.trucks.push({ body: S([at(h + 1, 4.1), at(h + 1 + R, 4.1), at(h + 1 + R, -4.1), at(h + 1, -4.1)]),
                      cab: S([at(h + R + 2, 4), at(h + R + 12, 4), at(h + R + 12, -4), at(h + R + 2, -4)]) });
  }
  return out;
}
/* polygon helpers for the angled geometry */
function segX(a, b, c, d){
  const o = (p, q, r) => Math.sign((q[0]-p[0])*(r[1]-p[1]) - (q[1]-p[1])*(r[0]-p[0]));
  return o(a,b,c) !== o(a,b,d) && o(c,d,a) !== o(c,d,b);
}
function polyHitsRect(poly, r){
  const rc = corners(r), inR = q => q[0] > r.x+0.05 && q[0] < r.x+r.w-0.05 && q[1] > r.y+0.05 && q[1] < r.y+r.h-0.05;
  if (poly.some(inR) || rc.some(c => inPoly(c, poly))) return true;
  for (let i = 0; i < poly.length; i++) for (let k = 0; k < 4; k++)
    if (segX(poly[i], poly[(i+1)%poly.length], rc[k], rc[(k+1)%4])) return true;
  return false;
}
const polyPath = pts => "M" + pts.map(q => q[0].toFixed(1) + " " + q[1].toFixed(1)).join("L") + "Z";

function ptSeg(p,a,b){ const dx=b[0]-a[0],dy=b[1]-a[1]; let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy);
  t=Math.max(0,Math.min(1,t)); return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy); }
function inPoly(p,poly){ let c=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){
  const [xi,yi]=poly[i],[xj,yj]=poly[j];
  if((yi>p[1])!==(yj>p[1]) && p[0]<(xj-xi)*(p[1]-yi)/(yj-yi)+xi) c=!c; } return c; }
function propDist(r){
  const cs=corners(r); if(!cs.every(c=>inPoly(c,PROP))) return -1;
  let d=Infinity;
  for(let i=0;i<PROP.length;i++){ const a=PROP[i],b=PROP[(i+1)%PROP.length];
    for(const c of cs) d=Math.min(d,ptSeg(c,a,b));
    for(let k=0;k<4;k++) d=Math.min(d,ptSeg(a,cs[k],cs[(k+1)%4])); }

        const vert=q.h>q.w*1.4, cx=q.x+q.w/2, cy=q.y+q.h/2;

        t.textContent=rm.short||rm.name; grp.append(t);
      }
    }
    grp.append(el("rect",{x:r.x,y:r.y,width:r.w,height:r.h,fill:ev.ok?"none":"url(#hatch)",
      stroke: ev.ok ? L.color : "#B23A2B", "stroke-width": sel===p.id ? 3 : 2, "vector-effect":"non-scaling-stroke"}));
    /* doors on the walls */
    for(const o of L.openings.filter(o=>o.face!=="I" && o.type!=="louvre")){
      const t=o.type==="door"?1.6:2.4, off=o.type==="door"?0.8:1.2;
      const q = o.face==="N" ? rectLocal(p,o.a,-off,o.b,t-off) : o.face==="S" ? rectLocal(p,o.a,L.D-t+off,o.b,L.D+off)
              : o.face==="W" ? rectLocal(p,-off,o.a,t-off,o.b) : rectLocal(p,L.W-t+off,o.a,L.W+off,o.b);
      const dock=o.type==="dock", roll=o.type==="rollup";
      grp.append(el("rect",{x:q.x,y:q.y,width:q.w,height:q.h,fill:dock?"#B23A2B":roll?"#fff":"#15181C",stroke:roll?"#B23A2B":"none","stroke-width":.8,"vector-effect":"non-scaling-stroke"}));
      if(!big && o.type!=="door"){
        const c=o.face==="W"?toSite(p,-4.5,(o.a+o.b)/2):o.face==="E"?toSite(p,L.W+4.5,(o.a+o.b)/2):toSite(p,(o.a+o.b)/2, o.face==="N"?-4.5:L.D+5.5);
        const lab=el("text",{x:c[0],y:c[1],"text-anchor":"middle","dominant-baseline":"middle","font-size":fs*.62,fill:"#B23A2B"}); lab.textContent=o.mark; grp.append(lab);
      }
    }
    g.append(grp);
  }
  drawItems(fs);
  /* gap from each packhouse's south wall to Grow 1–3 */
  const grow=BLDG.find(b=>b.name==="Grow 1–3");
  for(const q of phs){
    const rq=rectOf(q), gap=grow.y-(rq.y+rq.h);
    if(gap<0 || gap>200 || rq.x+rq.w<grow.x || rq.x>grow.x+grow.w) continue;
    const x=rq.x+rq.w*0.72, y0=rq.y+rq.h, y1=grow.y;
    /* only the building facing Grow 1–3 directly gets the line; skip it if the other building sits in between */
    const ro=rectOf(phs.find(o=>o!==q)); if(x>=ro.x && x<=ro.x+ro.w && ro.y>=y0 && ro.y<y1) continue;
    d.append(el("line",{x1:x,y1:y0,x2:x,y2:y1,stroke:"#15181C","stroke-width":1.2,"vector-effect":"non-scaling-stroke"}));
    for(const yy of [y0,y1]) d.append(el("line",{x1:x-3,y1:yy,x2:x+3,y2:yy,stroke:"#15181C","stroke-width":1.2,"vector-effect":"non-scaling-stroke"}));
    const t=el("text",{x:x+3,y:(y0+y1)/2,"dominant-baseline":"middle","font-size":fs*.8,fill:"#15181C",stroke:"#fff","stroke-width":fs*.25,"paint-order":"stroke"});
    t.textContent=gap.toFixed(1)+"' to Grow 3"; d.append(t);
  }
  /* clearance tick from the selected building to its nearest existing building */
  const p=phs.find(q=>q.id===sel), r=p&&rectOf(p), ev=p&&evaluate(p);
  const nb=p&&BLDG.find(b=>b.name===ev.near.name);
  if(nb && ev.near.d<60){
    const cy=Math.max(r.y,Math.min(nb.y+nb.h,r.y+r.h/2));
    const ax = r.x>=nb.x+nb.w ? [nb.x+nb.w, r.x] : r.x+r.w<=nb.x ? [r.x+r.w, nb.x] : null;
    if(ax){ d.append(el("line",{x1:ax[0],y1:cy,x2:ax[1],y2:cy,stroke:"#15181C","stroke-width":1.2,"vector-effect":"non-scaling-stroke"}));
      const t=el("text",{x:(ax[0]+ax[1])/2,y:cy-3,"text-anchor":"middle","font-size":fs*.8,fill:"#15181C"}); t.textContent=ev.near.d.toFixed(1)+"'"; d.append(t); }
  }
  cards();
}

function row(k,v,min,ok){ return `<span class="k">${k}</span><span class="v ${ok?"":"no"}">${v}</span><span class="m">${min}</span>`; }
const nudge = p => { const h = HOME.find(q => q.id === p.id), dx = p.x - h.x, dy = p.y - h.y;
  if (!dx && !dy) return "at the set position";
  const f = v => (Math.round(Math.abs(v) * 10) / 10) + " ft";
  return "nudged " + [dx ? f(dx) + (dx > 0 ? " east" : " west") : "", dy ? f(dy) + (dy > 0 ? " south" : " north") : ""].filter(Boolean).join(", "); };
function cards(){
  const box=$("#cards"); box.replaceChildren();
  const bad=[];
  for(const p of phs){
    const L=lay(p), ev=evaluate(p), r=rectOf(p);
    if(!ev.ok) bad.push(L.name);
    const docks=L.openings.filter(o=>o.type==="dock").length, rolls=L.openings.filter(o=>o.type==="rollup").length;
    const c=document.createElement("div"); c.className="ph"+(sel===p.id?" sel":"");
    c.innerHTML=`<div class="top"><h3><i style="background:${L.color}"></i>${L.name}</h3>
        <span class="pill ${ev.ok?"ok":"no"}">${ev.ok?"Clear":"Fix"}</span></div>
      <div class="ctl">
        <span class="face">Docks face <b>${faceName(p,"N")}</b> · ${docks} dock${docks>1?"s":""}, ${rolls} roll-up${rolls>1?"s":""}</span>
      </div>
      <div class="rows">
        ${row("Property line", ev.prop<0?"outside":ev.prop.toFixed(1)+" ft", "min 20", ev.prop>=SETBACK-0.05)}
        ${row(ev.near.name, ev.near.d.toFixed(1)+" ft", "min 15", ev.near.d>=GAP-0.05)}
        ${row(ev.other, ev.pair.toFixed(1)+" ft", "min 15", ev.pair>=GAP-0.05)}
        ${ev.near.name==="Grow 1–3" ? "" : row("Grow 1–3", ev.grow.toFixed(1)+" ft", "min 15", ev.grow>=GAP-0.05)}
        ${row("Truck apron", ev.apron, APRON+" ft", ev.apronOk)}
        ${ev.outdoor ? row("Bin wash", ev.outdoor, "66 × 30", ev.outdoorOk) : ""}
      </div>
      <p class="pos mono">${r.w} × ${r.h} ft · ${nudge(p)}</p>`;
    c.addEventListener("click",()=>{ sel=p.id; draw(); });
    box.append(c);
  }
  for(const it of items.filter(i=>i.kind!=="park")){
    const ev=evalItem(it), [L,D]=itemDims(it);
    if(!ev.ok) bad.push(it.name);
    const c=document.createElement("div"); c.className="ph"+(sel===it.id?" sel":"");
    const spots = it.id==="park" ? `<div class="seg" role="group" aria-label="Suggested spots">${PARK_SPOTS.map((q,i)=>`<button type="button" data-spot="${i}" aria-pressed="${it.x===q.x&&it.y===q.y&&it.ang===q.ang&&it.rows===q.rows}">${q.k}</button>`).join("")}</div>` : "";
    c.innerHTML=`<div class="top"><h3><i style="background:${it.kind==="septic"?"#A9702B":"#848C92"}"></i>${it.name}</h3>
        <span class="pill ${ev.ok?"ok":"no"}">${ev.ok?"Clear":"Fix"}</span></div>
      <div class="ctl">${spots}<button type="button" class="btn" data-rot>Rotate 90°</button></div>
      <div class="rows">
        ${row("Property line", ev.on?ev.prop.toFixed(1)+" ft":"outside", "", ev.on)}
        ${row(ev.near.name, ev.near.d.toFixed(1)+" ft", it.kind==="septic"?"min "+SEPTIC_GAP+"*":"", ev.gapOk)}
        ${row("Overlaps", ev.hits.length?ev.hits.join(", "):"nothing", "", !ev.hits.length)}
      </div>
      <p class="pos mono">${L} × ${D} ft${it.kind==="park"?" · "+it.stalls+" stalls":""}${it.kind==="septic"?" · *placeholder, confirm":""} · turned ${+it.ang.toFixed(1)}°</p>`;
    c.addEventListener("click",e=>{ if(e.target.closest("button")) return; sel=it.id; draw(); });
    c.querySelectorAll("[data-spot]").forEach(b=>b.onclick=()=>{ const q=PARK_SPOTS[+b.dataset.spot]; Object.assign(it, {x:q.x, y:q.y, ang:q.ang, rows:q.rows}); sel=it.id; changed(); });
    c.querySelector("[data-rot]").onclick=()=>{ it.ang=(it.ang+90)%360; sel=it.id; changed(); };
    box.append(c);
  }
}
(function(){
  const svg=$("#map"), defs=el("defs"), pat=el("pattern",{id:"hatch",width:6,height:6,patternUnits:"userSpaceOnUse",patternTransform:"rotate(45)"});
  pat.append(el("line",{x1:0,y1:0,x2:0,y2:6,stroke:"#B23A2B","stroke-width":1.2,"stroke-opacity":".6"})); defs.append(pat);
  const rh=el("pattern",{id:"rampHatch",width:4,height:4,patternUnits:"userSpaceOnUse",patternTransform:"rotate(90)"});   /* ramps: concrete with stripes across the fall */
  rh.append(el("rect",{width:4,height:4,fill:"#BDBDB6"}), el("line",{x1:0,y1:0,x2:0,y2:4,stroke:"#7D7D77","stroke-width":.8})); defs.append(rh); svg.prepend(defs);
  $("#prop").setAttribute("d",pathOf(PROP));
  $("#setback").setAttribute("d",pathOf(offsetPoly(PROP,SETBACK)));
  /* the Lettuce Grow sits 19.5 ft west of where the CEAd sheet draws it: cover the strip it leaves and draw it anew */
  /* The Lettuce Grow is redrawn at 4 bays × 29 sections, west edge in line with the Existing Facility: cover what the
     CEAd sheet drew beyond it as ground, then draw it with its gutter lines every 42 ft */
  /* the old grow ran to x 485.2 and y 636, with its purple wall lines just outside: cover a few feet past that */
  const mv=$("#moved"), LG=BLDG.find(b=>b.name==="Lettuce Grow"), OLD={x:131.6,y:461,w:353.6,h:175}, M=3, ground={fill:"#B9AD8F"};
  if(OLD.x+OLD.w>LG.x+LG.w) mv.append(el("rect",{x:LG.x+LG.w,y:OLD.y-M,width:OLD.x+OLD.w+M-LG.x-LG.w,height:OLD.h+2*M,...ground}));
  if(OLD.y+OLD.h>LG.y+LG.h) mv.append(el("rect",{x:OLD.x-M,y:LG.y+LG.h,width:LG.x+LG.w-OLD.x+M,height:OLD.y+OLD.h+M-LG.y-LG.h,...ground}));
  /* the sheet's block wall (purple) and white end boxes between the existing house and the grow are not real: ground */
  mv.append(el("rect",{x:112,y:446.2,width:374,height:LG.y-446.2+0.5,...ground}));
  mv.append(el("rect",{x:LG.x,y:LG.y,width:LG.w,height:LG.h,fill:"#F7F7F4",stroke:"#7A5BC0","stroke-width":1.4,"vector-effect":"non-scaling-stroke"}));
  for(let b=1;b<4;b++) mv.append(el("line",{x1:LG.x,y1:LG.y+42*b,x2:LG.x+LG.w,y2:LG.y+42*b,stroke:"#848C92","stroke-width":.8,"stroke-dasharray":"4 3","vector-effect":"non-scaling-stroke"}));
  for(let c=1;c<29;c++) mv.append(el("line",{x1:LG.x+12*c,y1:LG.y,x2:LG.x+12*c,y2:LG.y+3,stroke:"#848C92","stroke-width":.6,"vector-effect":"non-scaling-stroke"}));
  const lt=el("text",{x:LG.x+LG.w/2,y:LG.y+LG.h/2-6,"text-anchor":"middle","font-size":14,fill:"#15181C"}); lt.textContent="LETTUCE GROW"; mv.append(lt);
  const ls=el("text",{x:LG.x+LG.w/2,y:LG.y+LG.h/2+10,"text-anchor":"middle","font-size":9,fill:"#565D64"}); ls.textContent="4 BAYS × 29 SECTIONS · 348 × 168 FT · 58,464 FT²"; mv.append(ls);
})();

/* Buildings are selected, not dragged: their positions are set and the arrow keys bump them. Parking and the
   septic drag anywhere. Positions ride in the URL hash, so a layout can be shared as a link. */
let drag=null;
const svgPt = e => { const s=$("#map"), pt=s.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; return pt.matrixTransform(s.getScreenCTM().inverse()); };
const thing = id => phs.find(q=>q.id===id) || items.find(q=>q.id===id);
$("#map").addEventListener("pointerdown",e=>{
  const g=e.target.closest(".item,.bld"); if(!g) return;
  sel=g.dataset.id;
  if(g.classList.contains("item")){
    const it=thing(sel), pt=svgPt(e); drag={it,dx:pt.x-it.x,dy:pt.y-it.y}; $("#map").setPointerCapture(e.pointerId); g.classList.add("drag");
  }
  draw();
});
$("#map").addEventListener("pointermove",e=>{ if(!drag) return; const pt=svgPt(e);
  drag.it.x=Math.round(pt.x-drag.dx); drag.it.y=Math.round(pt.y-drag.dy); draw(); });
$("#map").addEventListener("pointerup",()=>{ if(drag){ drag=null; changed(); } });
document.addEventListener("keydown",e=>{
  const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key]; if(!m) return;
  if(e.target.closest && e.target.closest("button,a")) return;
  e.preventDefault(); const p=thing(sel), s=e.shiftKey?5:1; p.x=Math.round((p.x+m[0]*s)*10)/10; p.y=Math.round((p.y+m[1]*s)*10)/10; changed();
});
function view(k){ viewK=k; $("#map").setAttribute("viewBox",VIEWS[k].join(" "));
  $("#v-pad").setAttribute("aria-pressed",k==="pad"); $("#v-site").setAttribute("aria-pressed",k==="site"); changed(); }
$("#v-pad").onclick=()=>view("pad"); $("#v-site").onclick=()=>view("site");
$("#reset").onclick=()=>{ phs=HOME.map(h=>({...h})); items=ITEM_HOME.map(i=>({...i})); sel="ph"; changed(); };
/* hash: view=site, ph=dx,dy for a nudged building, park=x,y,ang for an item away from home */
function changed(){
  const parts=viewK==="site"?["view=site"]:[];
  for(const p of phs){ const h=HOME.find(q=>q.id===p.id); if(p.x!==h.x||p.y!==h.y) parts.push(`${p.id}=${+(p.x-h.x).toFixed(1)},${+(p.y-h.y).toFixed(1)}`); }
  for(const it of items){ const h=ITEM_HOME.find(q=>q.id===it.id); if(it.x!==h.x||it.y!==h.y||it.ang!==h.ang||it.rows!==h.rows) parts.push(`${it.id}=${+it.x.toFixed(1)},${+it.y.toFixed(1)},${+it.ang.toFixed(1)}${it.rows?","+it.rows:""}`); }
  try{ history.replaceState(null,"",parts.length?"#"+parts.join(";"):location.pathname+location.search); }catch(e){}
  draw();
}
(function(){
  for(const t of location.hash.slice(1).split(";")){
    const [k,v]=t.split("="); if(!v) continue;
    if(k==="view"){ if(v==="site"){ viewK="site"; $("#map").setAttribute("viewBox",VIEWS.site.join(" ")); $("#v-pad").setAttribute("aria-pressed",false); $("#v-site").setAttribute("aria-pressed",true); } continue; }
    const n=v.split(",").map(Number); if(n.some(isNaN)) continue;
    const p=phs.find(q=>q.id===k); if(p){ p.x+=n[0]; p.y+=n[1]; continue; }
    const it=items.find(q=>q.id===k); if(it){ it.x=n[0]; it.y=n[1]; if(n.length>2) it.ang=n[2]; if(n.length>3 && it.rows) it.rows=n[3]===1?1:2; }
  }
  draw();
})();
</script>
